schema_version: 1

context:
  version: "0.2.2"

package:
  name: pykale
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pykale/pykale-${{ version }}.tar.gz
  sha256: 76016e09633d47fd21fc35a590ea41c06383f07f99576aa34bb6721a82bc4dd0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools ==82.0.1
    - wheel
    - numpy
    - pip
  run:
    - python >=${{ python_min }},<3.13
    - numpy >=2.0.0
    - pandas <=2.2.2
    - pytorch-lightning >=2.3.2
    - scipy >=1.13.0
    - scikit-learn >=1.6.1
    - tensorly >=0.5.1
    - pytorch <=2.6.0
    - torchvision >=0.12.0
    - pooch >=1.8.0
tests:
  - python:
      imports:
        - kale
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Knowledge-aware machine learning from multiple sources in Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pykale/pykale
  repository: https://github.com/pykale/pykale
  documentation: https://pykale.readthedocs.io

extra:
  recipe-maintainers:
    - jan-janssen
